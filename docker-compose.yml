# PostgreSQL for the check records (CLAUDE.md §5). Start with: docker compose up -d
# Host port 5433, so it does not clash with a PostgreSQL already installed on 5432.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: safesight
      POSTGRES_PASSWORD: safesight  # local prototype only; set a real one outside a laptop
      POSTGRES_DB: safesight
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safesight"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
